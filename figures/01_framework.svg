   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="8.914176" y="14.151213" transform="rotate(-0 8.914176 14.151213)">From public evidence to a measured persona benchmark</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="8.914176" y="27.717727" transform="rotate(-0 8.914176 27.717727)">Aircraft-containing overnight journeys reported in MiD 2023</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="16.456896" y="57.88855" transform="rotate(-0 16.456896 57.88855)">01  PUBLIC EVIDENCE</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="188.430912" y="57.88855" transform="rotate(-0 188.430912 57.88855)">02  DATA-DRIVEN PERSONAS</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="360.404928" y="57.88855" transform="rotate(-0 360.404928 57.88855)">03  LLM PROBABILITIES</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="16.959744" y="81.316974" transform="rotate(-0 16.959744 81.316974)">Archive raw responses</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="16.959744" y="96.160637" transform="rotate(-0 16.959744 96.160637)">Record query, source and hash</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="23.496768" y="117.653013" transform="rotate(-0 23.496768 117.653013)">Cohort | mode | weighted share</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="23.496768" y="130.879125" transform="rotate(-0 23.496768 130.879125)">Unweighted support | coverage</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="16.959744" y="153.834461" transform="rotate(-0 16.959744 153.834461)">Compute conditional mode rates</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.95px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="16.959744" y="166.566674" transform="rotate(-0 16.959744 166.566674)">Car  /  local PT  /  long-distance rail</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="188.93376" y="81.316974" transform="rotate(-0 188.93376 81.316974)">Rank cohort heterogeneity</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="188.93376" y="96.392237" transform="rotate(-0 188.93376 96.392237)">2 traveller + 2 journey features</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="188.93376" y="113.157388" transform="rotate(-0 188.93376 113.157388)">Retain adequately supported strata</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #008d80" x="254.304" y="132.705257" transform="rotate(-0 254.304 132.705257)">ONE ATTRIBUTE PER PERSONA</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="188.93376" y="153.686138" transform="rotate(-0 188.93376 153.686138)">No invented combinations of attributes</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="188.93376" y="167.759018" transform="rotate(-0 188.93376 167.759018)">Withhold cohort rates from prompts</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="360.907776" y="81.316974" transform="rotate(-0 360.907776 81.316974)">Three co-use probabilities</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="360.907776" y="95.628747" transform="rotate(-0 360.907776 95.628747)">Small + large LLMs / OpenRouter</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8f5b9f" x="367.4448" y="108.16006" transform="rotate(-0 367.4448 108.16006)">Unanchored</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="367.4448" y="118.086025" transform="rotate(-0 367.4448 118.086025)">Persona + task definition</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8f5b9f" x="367.4448" y="140.45638" transform="rotate(-0 367.4448 140.45638)">Overall-rate anchored</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566a77" x="367.4448" y="150.382345" transform="rotate(-0 367.4448 150.382345)">Same task + national mode rates</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #566a77" x="425.775168" y="169.98809" transform="rotate(-0 425.775168 169.98809)">3 repeats per model and condition</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="90.8784" y="198.528514" transform="rotate(-0 90.8784 198.528514)">Observed weighted rates</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #8f5b9f" x="417.7296" y="198.528514" transform="rotate(-0 417.7296 198.528514)">Predicted probabilities</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183142" x="18.468288" y="237.337406" transform="rotate(-0 18.468288 237.337406)">04  QUANTITATIVE VALIDATION</text>
   </g>
   <g id="text_28">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #183142" transform="translate(18.468288 254.501331)">Compare persona predictions</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #183142" transform="translate(18.468288 266.412268)">with a cohort-blind national baseline</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #183142" transform="translate(266.8752 254.501331)">Absolute error  /  calibration  /  repeat variation</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #183142" transform="translate(266.8752 265.666331)">Agreement with published cohort marginals</text>
   </g>
   <g id="text_30">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #566a77" x="254.304" y="300.928005" transform="rotate(-0 254.304 300.928005)">Scope: aggregate validation; no individual reconstruction or identification of airport-access legs.</text>
   </g>
  </g>
